name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  library:
    name: Standalone Python distribution
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and inspect library
        run: |
          python -m pip install build twine
          python -m build packages/aaos-logging-drive --outdir dist
          python -m twine check dist/*
          python tools/check_packages.py
      - name: Test installed wheel without Home Assistant
        run: |
          python -m pip install dist/*.whl
          python -m unittest discover -s packages/aaos-logging-drive/tests -v

  hacs:
    name: HACS requirements
    runs-on: ubuntu-latest
    steps:
      - name: Validate integration repository
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
          comment: "false"

  hassfest:
    name: Home Assistant integration metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master

  tests:
    name: Importer and dashboard tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt ./packages/aaos-logging-drive
      - name: Test importer and Home Assistant adapters
        run: python -m unittest discover -s tests -t . -q
      - name: Check Python sources
        run: python -m compileall -q custom_components packages/aaos-logging-drive/src tools
      - name: Test trip dashboard
        run: |
          node --check custom_components/aaos_drive/www/history.js
          node tests/test_dashboard.js
      - name: Build and verify release ZIP
        run: python tools/build_release.py
