name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS requirements
    runs-on: ubuntu-latest
    steps:
      - name: Validate integration repository
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
          comment: "false"

  hassfest:
    name: Home Assistant integration metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3 # master

  tests:
    name: Importer and dashboard tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Test importer and Home Assistant adapters
        run: python -m unittest discover -s tests -t . -q
      - name: Check Python sources
        run: python -m compileall -q custom_components tools
      - name: Test trip dashboard
        run: |
          node --check custom_components/aaos_drive/www/history.js
          node tests/test_dashboard.js
      - name: Build and verify release ZIP
        run: python tools/build_release.py
