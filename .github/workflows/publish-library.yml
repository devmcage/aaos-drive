name: Publish library to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact library version to publish from main
        required: true
        type: string
        default: "0.1.0"

permissions:
  contents: read

concurrency:
  group: pypi-aaos-logging-drive
  cancel-in-progress: false

jobs:
  build:
    name: Build and test distributions
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      EXPECTED_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Check requested version
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          project = tomllib.loads(Path("packages/aaos-logging-drive/pyproject.toml").read_text())["project"]
          if project["version"] != os.environ["EXPECTED_VERSION"]:
              raise SystemExit("Requested version does not match library metadata")
          PY
      - name: Build and inspect library
        run: |
          python -m pip install build twine
          python -m build packages/aaos-logging-drive --outdir dist
          python -m twine check dist/*
          python tools/check_packages.py
      - name: Test installed wheel without Home Assistant
        run: |
          python -m pip install dist/*.whl
          python -m unittest discover -s packages/aaos-logging-drive/tests -v
      - name: Test Home Assistant wrapper and dashboard
        run: |
          python -m pip install -r requirements-test.txt
          python -m unittest discover -s tests -t . -q
          node --check custom_components/aaos_drive/www/history.js
          node tests/test_dashboard.js
          python tools/build_release.py
      - name: Save tested distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish with PyPI Trusted Publishing
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/aaos-logging-drive/
    permissions:
      id-token: write
    steps:
      - name: Retrieve tested distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  verify:
    name: Verify installation from PyPI
    needs: publish
    runs-on: ubuntu-latest
    env:
      EXPECTED_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install published version in a fresh environment
        run: |
          python -m venv published-package
          for attempt in 1 2 3 4 5 6; do
            if published-package/bin/python -m pip install --no-cache-dir --index-url https://pypi.org/simple "aaos-logging-drive==$EXPECTED_VERSION"; then
              break
            fi
            if [ "$attempt" = 6 ]; then exit 1; fi
            sleep 10
          done
          published-package/bin/python - <<'PY'
          from importlib.metadata import version
          from importlib.util import find_spec
          import os

          from aaos_logging_drive import AAOSDriveClient, __version__

          assert version("aaos-logging-drive") == os.environ["EXPECTED_VERSION"] == __version__
          assert find_spec("homeassistant") is None
          print(f"Verified standalone PyPI installation: aaos-logging-drive=={__version__}")
          PY
