[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aaos-logging-drive"
version = "0.1.0"
description = "Read-only AAOS Logging Google Drive synchronization and recorded vehicle data processing"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "AAOS Logging contributors"}]
dependencies = ["aiohttp>=3.12,<4", "tzdata>=2024.1"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aaos_logging_drive = ["py.typed"]
